<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koffie Tips & Reviews – Koffiemachinetest.nl</title>
<meta name="description" content="Laatste koffiemachine reviews, tips en vergelijkingen voor de Nederlandse markt.">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0f0a05; --bg2: #1a1005; --surface: #2a1f0f; --border: rgba(255,255,255,0.08); --text: #fdf6ee; --muted: #a89070; --accent: #c8873a; --gradient: linear-gradient(135deg, #c8873a, #8b4513); }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; background: rgba(15,10,5,0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.25rem; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { color: var(--muted); text-decoration: none; font-size: .9rem; }
  .nav-cta { background: var(--gradient); color: white; border: none; padding: .5rem 1.25rem; border-radius: 8px; font-size: .9rem; font-weight: 500; text-decoration: none; }
  .hero { padding: 120px 2rem 60px; text-align: center; }
  .hero h1 { font-family: 'Syne', sans-serif; font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; }
  .hero h1 span { background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero p { color: var(--muted); max-width: 540px; margin: 0 auto; font-size: 1.1rem; }
  .blog-section { max-width: 1100px; margin: 0 auto; padding: 40px 2rem 80px; }
  .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
  .blog-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; text-decoration: none; color: var(--text); display: flex; flex-direction: column; gap: .75rem; transition: border-color .2s, transform .2s; }
  .blog-card:hover { border-color: var(--accent); transform: translateY(-3px); }
  .blog-label { font-size: .75rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .1em; }
  .blog-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; line-height: 1.3; }
  .blog-date { font-size: .8rem; color: var(--muted); }
  .blog-read { font-size: .85rem; color: var(--accent); font-weight: 600; margin-top: auto; }
  .loading { text-align: center; color: var(--muted); padding: 40px; }
  footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 3rem 2rem; text-align: center; }
  .footer-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.4rem; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: .5rem; }
  .footer-text { font-size: .82rem; color: var(--muted); max-width: 600px; margin: 0 auto 1.5rem; }
  .footer-links { display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; }
  .footer-links a { font-size: .82rem; color: var(--muted); text-decoration: none; }
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">Koffiemachinetest.nl</a>
  <ul class="nav-links">
    <li><a href="/">Vergelijking</a></li>
    <li><a href="/blog.html">Reviews</a></li>
  </ul>
  <a href="/" class="nav-cta">Beste keuze →</a>
</nav>
<div class="hero">
  <h1>Koffie <span>Tips & Reviews</span></h1>
  <p>Onafhankelijke koffiemachine reviews en koopgidsen voor de Nederlandse markt.</p>
</div>
<div class="blog-section">
  <div id="blog-grid" class="blog-grid">
    <div class="loading">Artikelen laden...</div>
  </div>
</div>
<footer>
  <div class="footer-logo">Koffiemachinetest.nl</div>
  <p class="footer-text">Onafhankelijke koffiemachine vergelijkingssite voor Nederland.</p>
  <div class="footer-links">
    <a href="/over-ons.html">Over ons</a>
    <a href="/privacy.html">Privacy policy</a>
  </div>
</footer>
<script>
const GITHUB_USER = 'guydeoncrul-ux';
const GITHUB_REPO = 'koffiemachinetest-site';
const FOLDER = 'artikelen';

async function loadArticles() {
  const grid = document.getElementById('blog-grid');
  try {
    const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER}`);
    const files = await response.json();
    if (!files || files.length === 0) {
      grid.innerHTML = '<div class="loading">Nog geen artikelen beschikbaar.</div>';
      return;
    }
    const articles = files.filter(f => f.name.endsWith('.html')).sort((a, b) => b.name.localeCompare(a.name));
    grid.innerHTML = articles.map(file => {
      const datePart = file.name.replace('artikel-', '').replace('.html', '').substring(0, 10);
      const title = file.name.replace('artikel-', '').replace('.html', '').replace(/-/g, ' ');
      return `<a href="${FOLDER}/${file.name}" class="blog-card">
        <div class="blog-label">Koffie Review</div>
        <div class="blog-title">${title}</div>
        <div class="blog-date">📅 ${datePart}</div>
        <div class="blog-read">Lees artikel →</div>
      </a>`;
    }).join('');
  } catch(e) {
    grid.innerHTML = '<div class="loading">Artikelen tijdelijk niet beschikbaar.</div>';
  }
}
loadArticles();
</script>
</body>
</html>
